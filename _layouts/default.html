<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://docs.ghazi.biz.id">
  <link rel="dns-prefetch" href="https://docs.ghazi.biz.id">
  {% if page.admin_shell %}<link rel="stylesheet" href="{{ '/assets/css/admin.css' | relative_url }}">{% else %}<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  <script>(function(){var saved=localStorage.getItem('ra-theme')||'system';var dark=saved==='dark'||(saved==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.themeMode=saved;})();</script>
</head>
<body>
  {% if page.admin_shell %}
    {{ content }}
  {% else %}
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="site-main">{{ content }}</main>
    <footer class="site-footer"><div><strong>{{ site.title }}</strong><p>{{ site.description }}</p></div><div class="footer-links"><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/blog/' | relative_url }}">Blog</a><a href="mailto:{{ site.email }}">Email</a><a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a></div></footer>
  {% endif %}
</body>
</html>
