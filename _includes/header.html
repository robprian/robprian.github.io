<header class="site-header">
  <nav class="navbar" aria-label="Main navigation"><div class="nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home"><img class="logo-light" src="{{ '/assets/img/ra-b.png' | relative_url }}" alt="{{ site.title }}"><img class="logo-dark" src="{{ '/assets/img/ra-w-transparent.png' | relative_url }}" alt=""></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"><span class="menu-label">Menu</span><span aria-hidden="true">+</span></button>
    <div class="nav-menu" id="site-menu"><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/' | relative_url }}#skills">Skills</a><a href="{{ '/' | relative_url }}#experience">Experience</a><a href="{{ '/projects/' | relative_url }}">Projects</a><a href="{{ '/blog/' | relative_url }}">Blog</a><a href="{{ '/' | relative_url }}#contact">Contact</a><button class="theme-toggle" type="button" aria-label="Change theme">Theme</button><a class="nav-github" href="https://github.com/{{ site.github_username }}" aria-label="Robby Aprianto on GitHub">GH</a></div>
  </div></nav>
</header>
<script>
  const toggle = document.querySelector('.menu-toggle');
  const menu = document.querySelector('#site-menu');
  toggle?.addEventListener('click', () => { const open = toggle.getAttribute('aria-expanded') === 'true'; toggle.setAttribute('aria-expanded', String(!open)); menu.classList.toggle('is-open', !open); });
</script>
<script>
  document.querySelectorAll('.theme-toggle').forEach(button => { const update = () => { button.dataset.themeMode = localStorage.getItem('ra-theme') || 'system'; }; update(); button.addEventListener('click', () => { const mode = localStorage.getItem('ra-theme') || 'system'; const next = mode === 'system' ? 'light' : mode === 'light' ? 'dark' : 'system'; localStorage.setItem('ra-theme', next); const dark = next === 'dark' || (next === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.dataset.themeMode = next; update(); }); });
</script>
